plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.time_of_war"
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.time_of_war"
        minSdkVersion 21
        targetSdk = 36
        // Використовуємо нативні змінні сучасного плагіна Flutter
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}




// Force disable AarMetadata tasks before execution phase
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name.contains("AarMetadata")) {
            task.enabled = false
        }
    }
}
