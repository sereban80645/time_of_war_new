name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - run: flutter clean && flutter pub get && flutter pub run flutter_launcher_icons && flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android launch smoke test
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -e
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell am force-stop com.example.time_of_war_new
            adb shell monkey -p com.example.time_of_war_new 1
            sleep 8
            if ! adb shell pidof com.example.time_of_war_new >/dev/null; then
              echo "APP_PROCESS_NOT_RUNNING"
              adb logcat -d -v brief | tail -n 400
              exit 1
            fi
            if adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: com.example.time_of_war_new" | tail -n 20; then
              echo "ANDROID_CRASH_LOG_FOUND"
              exit 1
            fi
            echo "ANDROID_LAUNCH_SMOKE_TEST_PASSED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
